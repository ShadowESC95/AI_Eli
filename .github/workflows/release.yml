name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # the oldest supported system: the AppImage starts on this one and anything newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries the app carries, and tools for the checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev libasound2-dev espeak-ng libespeak-ng1 libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxcb-shape0 libxcb-randr0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Python packages
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt pyaudio pyinstaller huggingface_hub

      - name: Speech model (packed in, so voice works offline)
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='build/whisper-base')"
          echo "d01c3014881c9c6f3133c182f3d2887eb6ca1c789a7538c5c007196857a0a6a9  build/whisper-base/model.bin" | sha256sum -c
          rm -rf build/whisper-base/.cache

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/ai_eli.spec
          python packaging/trim_bundle.py dist/AI_Eli

      - name: Ollama with a small model, for the chat check
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:11434/api/tags >/dev/null && break; (ollama serve >/tmp/ollama.log 2>&1 &); sleep 2; done
          ollama pull qwen2.5:0.5b

      - name: Selftest (offscreen with speech and chat, then on a real X display)
        run: |
          espeak-ng -w build/speech.wav "open the calculator and play some music"
          ELI_SELFTEST_WAV="$PWD/build/speech.wav" ELI_SELFTEST_CHAT=1 dist/AI_Eli/AI_Eli --selftest
          xvfb-run -a env QT_QPA_PLATFORM=xcb dist/AI_Eli/AI_Eli --selftest

      - name: AppImage
        run: |
          bash packaging/build_appimage.sh "${GITHUB_REF_NAME#v}"
          ELI_SELFTEST_WAV="$PWD/build/speech.wav" ./dist/AI_Eli-*.AppImage --appimage-extract-and-run --selftest
          cd dist && sha256sum AI_Eli-*.AppImage > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: AI_Eli-linux
          path: |
            dist/AI_Eli-*.AppImage
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "AI_Eli ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release_notes.md dist/AI_Eli-*.AppImage dist/SHA256SUMS.txt
