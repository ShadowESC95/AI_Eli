# High-level configuration for the pipeline
provider:
  name: "none"        # options: none|openai|anthropic|azure|ollama|other
  model: "gpt-4o"     # replace if you wire to a provider

paths:
  input_dir: "data/input"
  cache_dir: "data/cache"
  out_dir: "out"

symbols:
  canonical_registry: "data/cache/symbols.yaml"  # generated after normalization

cas:
  enable_units: false
  natural_units: true
  si_units_for_exports: true
